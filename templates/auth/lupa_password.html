<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Password {{ jenis }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            font-family:'Poppins', sans-serif;
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:24px;
            min-height:100vh;
            background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .reset-card{
            width:100%;
            max-width:520px;
            background:white;
            border-radius:28px;
            padding:42px;
            box-shadow:0 20px 40px rgba(0,0,0,0.2);
            animation:fadeIn 0.5s ease;
        }

        .logo-box{
            width:88px;
            height:88px;
            margin:auto;
            border-radius:50%;
            background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:34px;
            font-weight:700;
            margin-bottom:22px;
        }

        .title{
            text-align:center;
            font-size:29px;
            font-weight:700;
            color:#0f172a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#64748b;
            margin-bottom:30px;
            line-height:1.6;
        }

        .form-label{
            font-weight:600;
            color:#334155;
        }

        .form-control{
            height:54px;
            border-radius:14px;
            border:1px solid #cbd5e1;
            padding-left:15px;
        }

        .form-control:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 0.2rem rgba(37,99,235,0.2);
        }

        .btn-reset{
            width:100%;
            height:54px;
            border:none;
            border-radius:14px;
            background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );
            color:white;
            font-size:16px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-reset:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 20px rgba(37,99,235,0.3);
            color:white;
        }

        .bottom-text{
            text-align:center;
            margin-top:24px;
            color:#64748b;
        }

        .bottom-text a,
        .success-link{
            text-decoration:none;
            color:#2563eb;
            font-weight:600;
        }

        .alert{
            border-radius:14px;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:576px){
            body{
                padding:16px;
            }

            .reset-card{
                padding:32px 24px;
                border-radius:22px;
            }

            .title{
                font-size:25px;
            }
        }

    </style>

</head>

<body>

    <div class="reset-card">

        <div class="logo-box">
            {{ ikon }}
        </div>

        <h2 class="title">
            Lupa Password {{ jenis }}
        </h2>

        <p class="subtitle">
            Masukkan data akun yang sesuai untuk membuat password baru.
        </p>

        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}

        {% if success %}

        <div class="alert alert-success">
            {{ success }}
        </div>

        <div class="text-center">
            <a href="{{ login_url }}" class="success-link">
                Kembali ke halaman login
            </a>
        </div>

        {% else %}

        <form
            method="POST"
            action="{{ action_url }}"
        >

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Masukkan username"
                    value="{{ request.form.get('username', '') }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    {{ identitas_label }}
                </label>

                <input
                    type="text"
                    name="{{ identitas_name }}"
                    class="form-control"
                    placeholder="{{ identitas_placeholder }}"
                    value="{{ request.form.get(identitas_name, '') }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password Baru
                </label>

                <input
                    type="password"
                    name="password_baru"
                    class="form-control"
                    placeholder="Minimal 6 karakter"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Konfirmasi Password
                </label>

                <input
                    type="password"
                    name="konfirmasi_password"
                    class="form-control"
                    placeholder="Ulangi password baru"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-reset"
            >
                Ubah Password
            </button>

        </form>

        <div class="bottom-text">
            Sudah ingat password?
            <a href="{{ login_url }}">
                Login
            </a>
        </div>

        {% endif %}

    </div>

</body>
</html>
